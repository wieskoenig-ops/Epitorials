<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden — Epitorials</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/Epitorials/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --blau: #1B4F8A; --blau-dunkel: #143d6b; --gruen: #8FB5A0; --schwarz: #1A1A1A; --grau: #5a6472; --weiss: #FFFFFF; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif; color: var(--schwarz); background: var(--weiss);
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center;
    }
    .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gruen); margin-bottom: 16px; }
    h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 700; line-height: 1.05; margin-bottom: 20px; }
    p { font-size: 17px; line-height: 1.6; color: var(--grau); max-width: 30em; margin: 0 auto 32px; }
    a.btn {
      display: inline-block; background: var(--blau); color: var(--weiss); text-decoration: none;
      font-size: 15px; font-weight: 600; padding: 14px 28px; border-radius: 4px; transition: background 0.2s;
    }
    a.btn:hover { background: var(--blau-dunkel); }
  </style>
</head>
<body>
  <main>
    <div class="kicker">404 · Epitorials</div>
    <h1>Diese Seite<br>gibt es nicht.</h1>
    <p>Vielleicht ein Tippfehler in der Adresse.</p>
    <a class="btn" href="/Epitorials/">Zur Startseite</a>
  </main>
</body>
</html>
